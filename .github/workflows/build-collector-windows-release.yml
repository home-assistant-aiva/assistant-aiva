name: Build Collector Windows Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish"
        required: true
        default: "v0.2.7-collector-desktop-rc2"
      publish_release:
        description: "Publish GitHub pre-release"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - "release/collector-desktop-rc2"

permissions:
  contents: read

env:
  AIVA_RELEASE_TAG: "v0.2.7-collector-desktop-rc2"
  AIVA_RELEASE_VERSION: "0.2.7-desktop-rc2"
  AIVA_RELEASE_TITLE: "AIVA Collector Desktop RC2"
  AIVA_INSTALLER_ASSET: "AIVA-Collector-Setup-v0.2.7-desktop-rc2.exe"
  AIVA_MANIFEST_ASSET: "AIVA-Collector-Installer-v0.2.7rc2.manifest.json"
  AIVA_MANUAL_ZIP_ASSET: "aiva-collector-windows-manual-v0.2.7-desktop-rc2.zip"

jobs:
  build-release:
    runs-on: windows-latest
    outputs:
      source_commit: ${{ steps.source-revision.outputs.commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify immutable source revision
        id: source-revision
        shell: pwsh
        env:
          AIVA_EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = $env:AIVA_EXPECTED_SHA.Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checked out commit $actual does not match workflow commit $expected" }
          "AIVA_BUILD_COMMIT=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append
          "commit=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read package version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "AIVA_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Package version: $version"

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Run Collector test suite
        run: |
          python -m pytest

      - name: Build Windows executables
        run: |
          python scripts/build_windows_exe.py

      - name: Verify executable commands
        shell: pwsh
        run: |
          $desktop = Start-Process -FilePath ".\dist\aiva-collector.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($desktop.ExitCode -ne 0) { throw "Desktop self-check failed: $($desktop.ExitCode)" }
          .\dist\aiva-collector-cli.exe --help
          $background = Start-Process -FilePath ".\dist\aiva-collector-background.exe" -ArgumentList "--help" -Wait -PassThru
          if ($background.ExitCode -ne 0) { throw "Background self-check failed: $($background.ExitCode)" }
          .\dist\aiva-collector-cli.exe activate --help
          .\dist\aiva-collector-cli.exe run-auto --help
          .\dist\aiva-collector-cli.exe discover --help

      - name: Create demo config for executable validation
        shell: pwsh
        run: |
          $config = Get-Content -Raw -LiteralPath "configs\example_config.json" | ConvertFrom-Json
          $root = (Get-Location).Path
          $discoveryRoot = Join-Path $env:RUNNER_TEMP "aiva_discovery_release_test"
          New-Item -ItemType Directory -Force -Path (Join-Path $discoveryRoot "Reportes") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $discoveryRoot "Sistema") | Out-Null
          "producto,cantidad,stock`nCoca,10,5" | Set-Content -Encoding UTF8 -LiteralPath (Join-Path $discoveryRoot "Reportes\ventas.csv")
          "fake sqlite placeholder" | Set-Content -Encoding UTF8 -LiteralPath (Join-Path $discoveryRoot "Sistema\sistema.db")
          $config.input_dir = Join-Path $root "samples\input"
          $config.processed_dir = Join-Path $env:RUNNER_TEMP "aiva_processed"
          $config.error_dir = Join-Path $env:RUNNER_TEMP "aiva_error"
          $config.output_dir = Join-Path $env:RUNNER_TEMP "aiva_output"
          $config.state_dir = Join-Path $env:RUNNER_TEMP "aiva_state"
          $config.log_file = Join-Path $env:RUNNER_TEMP "aiva_logs\aiva_collector.log"
          $discovery = [pscustomobject]@{
            include_paths = @($discoveryRoot)
            include_user_dirs = $false
            include_program_dirs = $false
            include_database_services = $false
          }
          if ($config.PSObject.Properties["discovery"]) {
            $config.discovery = $discovery
          } else {
            $config | Add-Member -MemberType NoteProperty -Name discovery -Value $discovery
          }
          $path = Join-Path $env:RUNNER_TEMP "aiva_config_demo.json"
          $config | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 -LiteralPath $path
          "AIVA_DEMO_CONFIG=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AIVA_DISCOVERY_ROOT=$discoveryRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify executable validate and discovery dry-run
        shell: pwsh
        run: |
          .\dist\aiva-collector-cli.exe validate --config "$env:AIVA_DEMO_CONFIG"
          .\dist\aiva-collector-cli.exe discover --config "$env:AIVA_DEMO_CONFIG" --dry-run --json --include-path "$env:AIVA_DISCOVERY_ROOT" | Tee-Object -Variable discoveryJson
          $parsed = $discoveryJson | ConvertFrom-Json
          if (-not ($parsed.items | Where-Object { $_.source_type -eq "watched_folder" })) { throw "watched_folder discovery not found" }
          if (-not ($parsed.items | Where-Object { $_.source_type -eq "database" -and $_.detected_engine -eq "sqlite" })) { throw "sqlite discovery not found" }

      - name: Verify packaging definitions before installer
        run: |
          python scripts/verify_windows_exe_package.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build Inno installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\inno\aiva_collector_setup.iss"

      - name: Build manual ZIP
        run: |
          python scripts/build_windows_package.py

      - name: Verify required Windows artifacts
        run: |
          python scripts/verify_windows_exe_package.py --require-artifacts

      - name: Verify clean install, RC1 update, task and uninstall
        shell: pwsh
        run: |
          .\scripts\verify_windows_installer.ps1 `
            -InstallerPath ".\dist\AIVA-Collector-Setup-v0.2.7-desktop-rc2.exe" `
            -ExpectedVersion "0.2.7rc2"

      - name: Rename release assets
        shell: pwsh
        run: |
          $installerSource = "dist\$env:AIVA_INSTALLER_ASSET"
          $manualSource = "dist\$env:AIVA_MANUAL_ZIP_ASSET"
          $manifestSource = "dist\$env:AIVA_MANIFEST_ASSET"
          if (-not (Test-Path $installerSource)) { throw "Missing installer: $installerSource" }
          if (-not (Test-Path $manualSource)) { throw "Missing manual ZIP: $manualSource" }
          if (-not (Test-Path $manifestSource)) { throw "Missing manifest: $manifestSource" }
          Copy-Item -LiteralPath "README-INSTALACION-COLLECTOR.txt" -Destination "dist\README-INSTALACION-COLLECTOR.txt" -Force

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $assets = @(
            "dist\$env:AIVA_INSTALLER_ASSET",
            "dist\$env:AIVA_MANIFEST_ASSET",
            "dist\$env:AIVA_MANUAL_ZIP_ASSET",
            "dist\README-INSTALACION-COLLECTOR.txt"
          )
          $lines = foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing asset for checksum: $asset" }
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $asset -Leaf)"
          }
          $lines | Set-Content -Encoding ASCII -LiteralPath "dist\SHA256SUMS.txt"
          Get-Content -LiteralPath "dist\SHA256SUMS.txt"

      - name: Assert release assets exist
        shell: pwsh
        run: |
          $required = @(
            "dist\$env:AIVA_INSTALLER_ASSET",
            "dist\$env:AIVA_MANIFEST_ASSET",
            "dist\$env:AIVA_MANUAL_ZIP_ASSET",
            "dist\SHA256SUMS.txt",
            "dist\README-INSTALACION-COLLECTOR.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing release asset: $path" }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiva-collector-windows-v${{ env.AIVA_RELEASE_VERSION }}
          if-no-files-found: error
          path: |
            dist/${{ env.AIVA_INSTALLER_ASSET }}
            dist/${{ env.AIVA_MANIFEST_ASSET }}
            dist/${{ env.AIVA_MANUAL_ZIP_ASSET }}
            dist/SHA256SUMS.txt
            dist/README-INSTALACION-COLLECTOR.txt
            dist/windows-installer-verification.json

  publish:
    name: Publish verified Windows pre-release
    needs: build-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    concurrency:
      group: aiva-collector-release-publication
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: aiva-collector-windows-v${{ env.AIVA_RELEASE_VERSION }}
          path: dist

      - name: Verify artifact source revision
        shell: pwsh
        env:
          AIVA_EXPECTED_SHA: ${{ needs.build-release.outputs.source_commit }}
        run: |
          $expected = $env:AIVA_EXPECTED_SHA.Trim().ToLowerInvariant()
          if ($expected -ne "${{ github.sha }}".ToLowerInvariant()) { throw "Build output commit does not match workflow commit" }
          $evidenceFiles = @(
            "dist/$env:AIVA_MANIFEST_ASSET",
            "dist/windows-installer-verification.json"
          )
          foreach ($path in $evidenceFiles) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing build evidence: $path" }
            $recorded = [string]((Get-Content -Raw -LiteralPath $path | ConvertFrom-Json).build_commit)
            if ($recorded.Trim().ToLowerInvariant() -ne $expected) { throw "Build evidence commit mismatch: $path" }
          }

      - name: Reject existing release or tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AIVA_REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:AIVA_REQUESTED_RELEASE_TAG
          git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Invalid release tag: $tag" }
          $PSNativeCommandUseErrorActionPreference = $false
          $releaseTags = @(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing releases" }
          $tagRefs = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref')
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing tags" }
          if ($releaseTags -contains $tag -or $tagRefs -contains "refs/tags/$tag") { throw "Release or tag already exists: $tag" }

      - name: Reserve immutable release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AIVA_RELEASE_TAG: ${{ inputs.release_tag }}
          AIVA_TARGET_SHA: ${{ needs.build-release.outputs.source_commit }}
        run: |
          $tag = $env:AIVA_RELEASE_TAG
          $target = $env:AIVA_TARGET_SHA.Trim().ToLowerInvariant()
          $PSNativeCommandUseErrorActionPreference = $false
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$target" --silent
          if ($LASTEXITCODE -ne 0) { throw "Could not reserve release tag without overwriting: $tag" }
          $reserved = [string](gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          if ($LASTEXITCODE -ne 0) { throw "Could not verify reserved release tag: $tag" }
          if ($reserved.Trim().ToLowerInvariant() -ne $target) { throw "Reserved release tag target mismatch: $tag" }

      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AIVA_RELEASE_TAG: ${{ inputs.release_tag }}
          AIVA_TARGET_SHA: ${{ needs.build-release.outputs.source_commit }}
          AIVA_RELEASE_NOTES: |
            # AIVA Collector Desktop RC2

            Pre-release para validar la aplicación visible y la conexión automática del Collector en Windows.

            Incluye:

            * aplicación gráfica que permanece abierta y muestra el estado real;
            * activación guiada mediante código de AIVA Comercial;
            * selección de la carpeta de datos desde Windows;
            * prueba de conexión y sincronización manual desde la aplicación;
            * reporte de discoveries por `POST /commerce/collector/data-source-discoveries`;
            * autenticacion con `Authorization: Bearer <collector_token>` y `X-AIVA-Collector-Id`;
            * sin dependencia de `X-AIVA-Secret` en PCs cliente;
            * reporte de fuente seleccionada en config como `selected_explicit`;
            * errores HTTP concretos para 401, 403, 404 y 422;
            * CLI de soporte separado en `aiva-collector-cli.exe`;
            * ejecución automática silenciosa con `aiva-collector-background.exe`;
            * runner background sin consola y salida dirigida a logs con rotacion;
            * datos, logs, estado, cola y configuracion en ProgramData;
            * preservacion de configuracion, token, cola y estado en actualizaciones;
            * tarea programada al iniciar sesion con delay de 60 segundos y repeticion cada 15 minutos;
            * eliminacion solo de tareas conocidas anteriores: `AIVA Collector`, `AIVA Collector Scheduled`, `AIVA Collector Auto`;
            * `run-auto` sin token en argumentos y sin discovery automatico repetido;
            * costo faltante tratado como `null`, sin margen inventado;
            * mejoras de logs, diagnostico y verificacion del paquete.

            No incluye todavia:

            * FASE 6.4C;
            * conexión directa a bases propietarias del sistema de caja;
            * prueba fisica final en la PC de Federico.

            Seguridad:

            * no se publican tokens ni configuraciones reales;
            * el instalador conserva ProgramData por defecto;
            * el paquete fue verificado por `verify_windows_exe_package.py`.

            Estado:

            * Desktop RC2 / pre-release.
            * Pendiente de prueba Windows fisica final por Federico.

            Validacion esperada:

            * instalar sobre INSTALADOR 2.5/RC anterior;
            * confirmar que se conserva activacion y ProgramData;
            * confirmar que la tarea usa `aiva-collector-background.exe`;
            * revisar logs y estado luego del inicio de sesion.
        run: |
          gh release create "$env:AIVA_RELEASE_TAG" `
            --verify-tag `
            --title "AIVA Collector Desktop RC2" `
            --notes "$env:AIVA_RELEASE_NOTES" `
            --prerelease `
            --target "$env:AIVA_TARGET_SHA" `
            "dist/$env:AIVA_INSTALLER_ASSET" `
            "dist/$env:AIVA_MANIFEST_ASSET" `
            "dist/$env:AIVA_MANUAL_ZIP_ASSET" `
            "dist/SHA256SUMS.txt" `
            "dist/README-INSTALACION-COLLECTOR.txt"
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed without overwriting existing resources" }
