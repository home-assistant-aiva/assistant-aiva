name: Build Collector Windows Source Setup Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish"
        required: true
        default: "v0.2.6-collector-discovery-rc5"
      publish_release:
        description: "Publish GitHub pre-release"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - "fix/collector-source-setup-rc5"
    tags:
      - "v0.2.6-collector-discovery-rc5"

permissions:
  contents: write

env:
  AIVA_RELEASE_TAG: "v0.2.6-collector-discovery-rc5"
  AIVA_RELEASE_VERSION: "0.2.6-source-setup-rc5"
  AIVA_RELEASE_TITLE: "AIVA Collector Source Setup RC5"
  AIVA_INSTALLER_ASSET: "AIVA-Collector-Setup-v0.2.6-source-setup-rc5.exe"
  AIVA_MANIFEST_ASSET: "AIVA-Collector-Installer-v0.2.6rc5.manifest.json"
  AIVA_MANUAL_ZIP_ASSET: "aiva-collector-windows-manual-v0.2.6-source-setup-rc5.zip"

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read package version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "AIVA_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Package version: $version"

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Run Collector test suite
        run: |
          python -m pytest

      - name: Build Windows executables
        run: |
          python scripts/build_windows_exe.py

      - name: Verify executable commands
        run: |
          .\dist\aiva-collector.exe --help
          .\dist\aiva-collector-background.exe --help
          .\dist\aiva-collector.exe activate --help
          .\dist\aiva-collector.exe run-auto --help
          .\dist\aiva-collector.exe discover --help
          .\dist\aiva-collector.exe configure-source --help
          .\dist\aiva-collector-background.exe prepare-config --help

      - name: Verify interactive executable stays open without arguments
        shell: pwsh
        run: |
          $menuOutput = "0" | .\dist\aiva-collector.exe 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Interactive executable failed with exit code $LASTEXITCODE" }
          if (-not ($menuOutput -match "Procesar ahora")) { throw "Interactive menu was not displayed" }
          if (-not ($menuOutput -match "Configurar o cambiar fuente")) { throw "Source setup option was not displayed" }
          if (-not ($menuOutput -match "Cerrando AIVA Collector")) { throw "Interactive menu did not exit cleanly" }

      - name: Create demo config for executable validation
        shell: pwsh
        run: |
          $config = Get-Content -Raw -LiteralPath "configs\example_config.json" | ConvertFrom-Json
          $root = (Get-Location).Path
          $discoveryRoot = Join-Path $env:RUNNER_TEMP "aiva_discovery_release_test"
          New-Item -ItemType Directory -Force -Path (Join-Path $discoveryRoot "Reportes") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $discoveryRoot "Sistema") | Out-Null
          "producto,cantidad,stock`nCoca,10,5" | Set-Content -Encoding UTF8 -LiteralPath (Join-Path $discoveryRoot "Reportes\ventas.csv")
          "fake sqlite placeholder" | Set-Content -Encoding UTF8 -LiteralPath (Join-Path $discoveryRoot "Sistema\sistema.db")
          $config.input_dir = Join-Path $root "samples\input"
          $config.processed_dir = Join-Path $env:RUNNER_TEMP "aiva_processed"
          $config.error_dir = Join-Path $env:RUNNER_TEMP "aiva_error"
          $config.output_dir = Join-Path $env:RUNNER_TEMP "aiva_output"
          $config.state_dir = Join-Path $env:RUNNER_TEMP "aiva_state"
          $config.log_file = Join-Path $env:RUNNER_TEMP "aiva_logs\aiva_collector.log"
          $discovery = [pscustomobject]@{
            include_paths = @($discoveryRoot)
            include_user_dirs = $false
            include_program_dirs = $false
            include_database_services = $false
          }
          if ($config.PSObject.Properties["discovery"]) {
            $config.discovery = $discovery
          } else {
            $config | Add-Member -MemberType NoteProperty -Name discovery -Value $discovery
          }
          $path = Join-Path $env:RUNNER_TEMP "aiva_config_demo.json"
          $config | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 -LiteralPath $path
          "AIVA_DEMO_CONFIG=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AIVA_DISCOVERY_ROOT=$discoveryRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify executable validate and discovery dry-run
        shell: pwsh
        run: |
          .\dist\aiva-collector.exe validate --config "$env:AIVA_DEMO_CONFIG"
          .\dist\aiva-collector.exe discover --config "$env:AIVA_DEMO_CONFIG" --dry-run --json --include-path "$env:AIVA_DISCOVERY_ROOT" | Tee-Object -Variable discoveryJson
          $parsed = $discoveryJson | ConvertFrom-Json
          if (-not ($parsed.items | Where-Object { $_.source_type -eq "watched_folder" })) { throw "watched_folder discovery not found" }
          if (-not ($parsed.items | Where-Object { $_.source_type -eq "database" -and $_.detected_engine -eq "sqlite" })) { throw "sqlite discovery not found" }

      - name: Verify guided source setup and read-only dry-run
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $env:RUNNER_TEMP "aiva_manual_source"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          Copy-Item -LiteralPath "samples\input\ventas_demo.csv" -Destination (Join-Path $sourceRoot "ventas_demo.csv") -Force
          .\dist\aiva-collector.exe configure-source --config "$env:AIVA_DEMO_CONFIG" --path "$sourceRoot"
          $configured = Get-Content -Raw -LiteralPath "$env:AIVA_DEMO_CONFIG" | ConvertFrom-Json
          if ($configured.input_dir -ne $sourceRoot) { throw "Manual source path was not saved" }
          if ($configured.source_mode -ne "external_read_only") { throw "Manual source is not read-only" }
          if ($configured.move_processed_files -ne $false) { throw "Manual source could move processed files" }
          if ($configured.move_error_files -ne $false) { throw "Manual source could move rejected files" }
          if ($configured.keep_original_files -ne $true) { throw "Manual source does not preserve originals" }
          $sourceOutput = .\dist\aiva-collector.exe configure-source --config "$env:AIVA_DEMO_CONFIG" --show-current 2>&1
          if (-not ($sourceOutput -match "Carpeta externa en modo solo lectura")) { throw "Active source mode was not displayed" }
          .\dist\aiva-collector.exe run-once --config "$env:AIVA_DEMO_CONFIG"
          if (-not (Test-Path (Join-Path $sourceRoot "ventas_demo.csv"))) { throw "Dry-run modified the source file" }

      - name: Verify RC4 config migration to canonical config.local.json
        shell: pwsh
        run: |
          $migrationRoot = Join-Path $env:RUNNER_TEMP "aiva_config_migration"
          New-Item -ItemType Directory -Force -Path $migrationRoot | Out-Null
          Copy-Item -LiteralPath "$env:AIVA_DEMO_CONFIG" -Destination (Join-Path $migrationRoot "config.windows.json") -Force
          $env:AIVA_COLLECTOR_STANDARD_DIR = $migrationRoot
          $env:AIVA_COLLECTOR_CONFIG_SEARCH_DIRS = $migrationRoot
          .\dist\aiva-collector-background.exe prepare-config
          $canonical = Join-Path $migrationRoot "config.local.json"
          if (-not (Test-Path $canonical)) { throw "Legacy config was not migrated to config.local.json" }
          $migrated = Get-Content -Raw -LiteralPath $canonical | ConvertFrom-Json
          if (-not $migrated.commerce_id -or -not $migrated.collector_id) { throw "Migrated config lost activation identity" }

      - name: Verify packaging definitions before installer
        run: |
          python scripts/verify_windows_exe_package.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build Inno installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\inno\aiva_collector_setup.iss"

      - name: Build manual ZIP
        run: |
          python scripts/build_windows_package.py

      - name: Verify required Windows artifacts
        run: |
          python scripts/verify_windows_exe_package.py --require-artifacts

      - name: Rename release assets
        shell: pwsh
        run: |
          $installerSource = "dist\$env:AIVA_INSTALLER_ASSET"
          $manualSource = "dist\$env:AIVA_MANUAL_ZIP_ASSET"
          $manifestSource = "dist\$env:AIVA_MANIFEST_ASSET"
          if (-not (Test-Path $installerSource)) { throw "Missing installer: $installerSource" }
          if (-not (Test-Path $manualSource)) { throw "Missing manual ZIP: $manualSource" }
          if (-not (Test-Path $manifestSource)) { throw "Missing manifest: $manifestSource" }
          Copy-Item -LiteralPath "README-INSTALACION-COLLECTOR.txt" -Destination "dist\README-INSTALACION-COLLECTOR.txt" -Force

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $assets = @(
            "dist\$env:AIVA_INSTALLER_ASSET",
            "dist\$env:AIVA_MANIFEST_ASSET",
            "dist\$env:AIVA_MANUAL_ZIP_ASSET",
            "dist\README-INSTALACION-COLLECTOR.txt"
          )
          $lines = foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing asset for checksum: $asset" }
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $asset -Leaf)"
          }
          $lines | Set-Content -Encoding ASCII -LiteralPath "dist\SHA256SUMS.txt"
          Get-Content -LiteralPath "dist\SHA256SUMS.txt"

      - name: Assert release assets exist
        shell: pwsh
        run: |
          $required = @(
            "dist\$env:AIVA_INSTALLER_ASSET",
            "dist\$env:AIVA_MANIFEST_ASSET",
            "dist\$env:AIVA_MANUAL_ZIP_ASSET",
            "dist\SHA256SUMS.txt",
            "dist\README-INSTALACION-COLLECTOR.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing release asset: $path" }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiva-collector-windows-v${{ env.AIVA_RELEASE_VERSION }}
          if-no-files-found: error
          path: |
            dist/${{ env.AIVA_INSTALLER_ASSET }}
            dist/${{ env.AIVA_MANIFEST_ASSET }}
            dist/${{ env.AIVA_MANUAL_ZIP_ASSET }}
            dist/SHA256SUMS.txt
            dist/README-INSTALACION-COLLECTOR.txt

      - name: Publish GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/fix/collector-source-setup-rc5' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || env.AIVA_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: AIVA Collector Source Setup RC5
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          body: |
            # AIVA Collector Source Setup RC5

            Pre-release para validar la configuracion guiada de fuentes del Collector en Windows.

            Incluye:

            * `aiva-collector.exe` abre un menu visible al ejecutarlo sin argumentos;
            * opcion guiada `Configurar o cambiar fuente`;
            * carpeta predeterminada administrada por AIVA;
            * carpeta manual o detectada en modo solo lectura, sin mover ni borrar originales;
            * opcion para ver la fuente activa y cantidad de CSV/XLSX disponibles;
            * prueba repetible sin enviar ni alterar la deduplicacion;
            * configuracion canonica unificada en `config.local.json`;
            * migracion automatica desde `config.windows.json` de RC4;
            * acceso directo principal `AIVA Collector` en el menu Inicio;
            * `Procesar ahora` mantiene visible el resultado y los errores;
            * ejecucion automatica silenciosa con `aiva-collector-background.exe`;
            * runner background sin consola y salida dirigida a logs con rotacion;
            * datos, logs, estado, cola y configuracion en ProgramData;
            * preservacion de configuracion, token, cola y estado en actualizaciones;
            * tarea programada al iniciar sesion con delay de 60 segundos y repeticion cada 15 minutos;
            * eliminacion solo de tareas conocidas anteriores: `AIVA Collector`, `AIVA Collector Scheduled`, `AIVA Collector Auto`;
            * `run-auto` sin token en argumentos y sin discovery automatico repetido;
            * costo faltante tratado como `null`, sin margen inventado;
            * mejoras de logs, diagnostico y verificacion del paquete.

            No incluye todavia:

            * flujo completo Admin/backend de FASE 6.4C;
            * conectores API o lectura real de bases locales;
            * prueba fisica final en la PC de Federico.

            Seguridad:

            * no se publican tokens ni configuraciones reales;
            * el instalador conserva ProgramData por defecto;
            * el paquete fue verificado por `verify_windows_exe_package.py`.

            Estado:

            * RC5 / pre-release.
            * El background silencioso y el menu RC4 ya fueron validados fisicamente por Federico.
            * Pendiente de validar fisicamente la configuracion de fuente de RC5.

            Validacion esperada:

            * instalar sobre RC4 o desde cero;
            * abrir `AIVA Collector` y comprobar que el menu permanece visible;
            * configurar la carpeta `C:\Ventas` o la carpeta predeterminada;
            * ejecutar `Probar fuente sin enviar` y luego `Procesar ahora`;
            * confirmar que se conserva activacion y ProgramData;
            * confirmar que la fuente elegida sigue activa despues de reiniciar;
            * confirmar que la tarea usa `aiva-collector-background.exe`;
            * revisar logs y estado luego del inicio de sesion.
          files: |
            dist/${{ env.AIVA_INSTALLER_ASSET }}
            dist/${{ env.AIVA_MANIFEST_ASSET }}
            dist/${{ env.AIVA_MANUAL_ZIP_ASSET }}
            dist/SHA256SUMS.txt
            dist/README-INSTALACION-COLLECTOR.txt
