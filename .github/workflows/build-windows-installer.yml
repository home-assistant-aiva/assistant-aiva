name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish verified artifacts to a GitHub release"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - collector-main
    paths:
      - "aiva_collector/**"
      - "packaging/**"
      - "scripts/build_windows_package.py"
      - "scripts/build_windows_exe.py"
      - "scripts/verify_windows_exe_package.py"
      - "windows/**"
      - "docs/aiva_collector_offline_queue.md"
      - "docs/aiva_collector_windows_exe.md"
      - "docs/aiva_collector_windows_installer.md"
      - "pyproject.toml"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.package-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read package version
        id: package-version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "AIVA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Run packaging tests
        run: |
          python -m pytest tests/test_windows_exe_packaging.py tests/test_windows_package.py tests/test_windows_assets.py tests/test_cli.py

      - name: Build aiva-collector.exe
        run: |
          python scripts/build_windows_exe.py

      - name: Verify executable help
        run: |
          .\dist\aiva-collector.exe --help
          .\dist\aiva-collector.exe activate --help
          .\dist\aiva-collector.exe run-auto --help

      - name: Create demo config for executable validation
        shell: pwsh
        run: |
          $config = Get-Content -Raw -LiteralPath "configs\example_config.json" | ConvertFrom-Json
          $root = (Get-Location).Path
          $config.input_dir = Join-Path $root "samples\input"
          $config.processed_dir = Join-Path $env:RUNNER_TEMP "aiva_processed"
          $config.error_dir = Join-Path $env:RUNNER_TEMP "aiva_error"
          $config.output_dir = Join-Path $env:RUNNER_TEMP "aiva_output"
          $config.state_dir = Join-Path $env:RUNNER_TEMP "aiva_state"
          $config.log_file = Join-Path $env:RUNNER_TEMP "aiva_logs\aiva_collector.log"
          $path = Join-Path $env:RUNNER_TEMP "aiva_config_demo.json"
          $config | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 -LiteralPath $path
          "AIVA_DEMO_CONFIG=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify executable validate
        shell: pwsh
        run: |
          .\dist\aiva-collector.exe validate --config "$env:AIVA_DEMO_CONFIG"

      - name: Verify packaging definitions before installer
        run: |
          python scripts/verify_windows_exe_package.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\inno\aiva_collector_setup.iss"

      - name: Create manual ZIP
        run: |
          python scripts/build_windows_package.py

      - name: Create technical ZIP and manifest
        run: |
          python scripts/verify_windows_exe_package.py --create-zip --require-artifacts

      - name: Print SHA256
        shell: pwsh
        run: |
          Get-FileHash "dist\aiva-collector.exe" -Algorithm SHA256 | Format-List
          Get-FileHash "dist\AIVA-Collector-Setup-v$env:AIVA_VERSION.exe" -Algorithm SHA256 | Format-List
          Get-FileHash "dist\aiva-collector-windows-exe-v$env:AIVA_VERSION.zip" -Algorithm SHA256 | Format-List
          Get-FileHash "dist\aiva-collector-windows-manual-v$env:AIVA_VERSION.zip" -Algorithm SHA256 | Format-List

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiva-collector-windows-v${{ env.AIVA_VERSION }}
          if-no-files-found: error
          path: |
            dist/aiva-collector.exe
            dist/AIVA-Collector-Setup-v${{ env.AIVA_VERSION }}.exe
            dist/AIVA-Collector-Installer-v${{ env.AIVA_VERSION }}.manifest.json
            dist/aiva-collector-windows-exe-v${{ env.AIVA_VERSION }}.zip
            dist/aiva-collector-windows-manual-v${{ env.AIVA_VERSION }}.zip
            dist/aiva-collector-windows-manual-v${{ env.AIVA_VERSION }}.manifest.json

  publish:
    name: Publish verified Windows installer
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: aiva-collector-windows-v${{ needs.build.outputs.package_version }}
          path: dist

      - name: Reject existing release or tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AIVA_RELEASE_TAG: v${{ needs.build.outputs.package_version }}-collector-installer
        run: |
          $tag = $env:AIVA_RELEASE_TAG
          git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Invalid release tag: $tag" }
          $PSNativeCommandUseErrorActionPreference = $false
          $releaseTags = @(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing releases" }
          $tagRefs = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref')
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing tags" }
          if ($releaseTags -contains $tag -or $tagRefs -contains "refs/tags/$tag") { throw "Release or tag already exists: $tag" }

      - name: Publish assets to new release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AIVA_RELEASE_TAG: v${{ needs.build.outputs.package_version }}-collector-installer
          AIVA_VERSION: ${{ needs.build.outputs.package_version }}
          AIVA_TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "$env:AIVA_RELEASE_TAG" `
            --title "$env:AIVA_RELEASE_TAG" `
            --notes "AIVA Collector Windows installer v$env:AIVA_VERSION" `
            --target "$env:AIVA_TARGET_SHA" `
            "dist/aiva-collector.exe" `
            "dist/AIVA-Collector-Setup-v$env:AIVA_VERSION.exe" `
            "dist/AIVA-Collector-Installer-v$env:AIVA_VERSION.manifest.json" `
            "dist/aiva-collector-windows-exe-v$env:AIVA_VERSION.zip" `
            "dist/aiva-collector-windows-manual-v$env:AIVA_VERSION.zip" `
            "dist/aiva-collector-windows-manual-v$env:AIVA_VERSION.manifest.json"
