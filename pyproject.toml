[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiva-collector"
version = "0.2.7rc1"
description = "AIVA Comercial Collector v1"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aiva_collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
